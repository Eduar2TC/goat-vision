name: goatvision
description: Goat weight estimation app using computer vision
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Camera
  camera: ^0.11.0+2

  # Permissions
  permission_handler: ^11.3.1

  # Image processing
  image: ^4.3.0

  # Storage
  path_provider: ^2.1.5
  path: ^1.9.1

  # ML
  tflite_flutter: ^0.11.0

  # UI
  flutter_svg: ^2.0.16
  fl_chart: ^0.69.2

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.6
  json_annotation: ^4.9.0
  logger: ^2.5.0

  # Markdown / simple formatting
  collection: ^1.19.1
  meta: ^1.15.0
  async: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.2
  freezed: ^2.5.8
  json_serializable: ^6.9.1
  mockito: ^5.4.4
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/markers/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
