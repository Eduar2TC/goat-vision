name: apriltag
description: A package for detecting apriltag on Dart and Flutter.
version: 0.0.2
repository: https://github.com/rainyl/apriltag.dart

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  meta: ^1.16.0
  native_toolchain_cmake: ^0.2.5

dev_dependencies:
  ffigen: ^20.1.1
  image: ^4.7.2
  lints: ^6.0.0
  test: ^1.24.0

topics:
  - apriltag
  - computer-vision
  - object-detection
  - robotics
  - aruco

hooks:
  user_defines:
    apriltag:
      options:
        debug: true
