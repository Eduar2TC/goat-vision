name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-tests:
    name: ML (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r ml/requirements-test.txt
      - name: Run ML test suite
        run: python -m unittest ml.tests.test_ml -v

  flutter:
    name: Flutter (analyze · test · APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Native SQLite (drift tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Pub get
        run: flutter pub get
        working-directory: mobile

      - name: Generate drift/freezed/json (gitignored)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: mobile

      - name: Analyze
        run: flutter analyze
        working-directory: mobile

      - name: Test
        run: flutter test
        working-directory: mobile

      - name: Android SDK (build APK)
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: 'true'

      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goatvision-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14