name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ml-tests:
    name: ML (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r ml/requirements-test.txt
      - name: Run ML test suite
        run: |
          set -o pipefail
          python -m unittest ml.tests.test_ml -v 2>&1 | tee ml_tests.log
      - name: Post failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$(tail -c 30000 ml_tests.log 2>/dev/null || true)"
          : >/dev/null
          BODY="### CI failure — ML (Python)

$(printf '%s' "$LOG")"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$BODY" --silent

  flutter:
    name: Flutter (analyze · test · APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Native SQLite (drift tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Set up log dir
        run: mkdir -p /tmp/ci-logs

      - name: Pub get
        working-directory: mobile
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/ci-logs/pubget.log

      - name: Generate drift/freezed/json (gitignored)
        working-directory: mobile
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 \
            | tee /tmp/ci-logs/runner.log

      - name: Analyze
        working-directory: mobile
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/ci-logs/analyze.log

      - name: Test
        working-directory: mobile
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/ci-logs/test.log

      - name: Android SDK (build APK)
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: 'true'

      - name: Build debug APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/ci-logs/apkbuild.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goatvision-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Post failure logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALL=""
          for f in /tmp/ci-logs/*.log; do
            [ -s "$f" ] || continue
            ALL="$ALL

===== $(basename "$f") =====

$(tail -c 20000 "$f")"
          done
          BODY="### CI failure — Flutter (${{ github.job }})$ALL"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$BODY" --silent || true