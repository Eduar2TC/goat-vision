name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ml-tests:
    name: ML (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-test.txt
      - name: Install test dependencies
        run: pip install -r ml/requirements-test.txt
      - name: Run ML test suite
        run: |
          set -o pipefail
          python -m unittest ml.tests.test_ml -v 2>&1 | tee ml_tests.log
      - name: Post failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI failure — ML (Python)\n\n' > /tmp/body.md
          tail -c 30000 ml_tests.log 2>/dev/null >> /tmp/body.md || true
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/body.md)" --silent

  flutter:
    name: Flutter (analyze · test · APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 3.38.1 (pinned)
        uses: subosito/flutter-action@v2
        with:
          # Pin explícito: riverpod_generator 2.6.x (usado vía riverpod 2)
          # no puede serializar el modelo de elementos del SDK de Dart 3.13
          # (dot-shorthands internos) — ver /E visitDotShorthandPropertyAccess.
          # La pubspec exige flutter >=3.38.1 y todas las deps de build
          # son compatibles con Dart 3.10. Quitar el pin al migrar a
          # riverpod 3.x.
          channel: 'stable'
          flutter-version: '3.38.1'
          cache: true

      - name: Native SQLite (drift tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache Gradle (caches + wrapper)
        # Ahorra los downloads de AGP/Kotlin/plugins y de .jars entre
        # corridas; el gate es igual, solo cambia el costo de I/O.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/settings.gradle.kts', 'mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache build nativo OpenCV (dartcv4)
        # El hook de dartcv4 compila OpenCV por FetchContent+CMake en
        # .dart_tool/hooks_runner/shared; costaba ~18 min enteros por
        # corrida. Con el build tree intacto, cmake --build no recompila
        # nada y la corrida cae a segundos.
        uses: actions/cache@v4
        with:
          path: mobile/.dart_tool/hooks_runner/shared/dartcv4/build
          key: dartcv-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            dartcv-${{ runner.os }}-

      - name: Set up log dir
        run: mkdir -p /tmp/ci-logs

      - name: Pub get
        working-directory: mobile
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/ci-logs/pubget.log

      - name: Generate drift/freezed/json (gitignored)
        working-directory: mobile
        run: |
          set -o pipefail
          dart run build_runner build --delete-conflicting-outputs 2>&1 \
            | tee /tmp/ci-logs/runner.log

      - name: Analyze
        working-directory: mobile
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/ci-logs/analyze.log

      - name: Test
        working-directory: mobile
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/ci-logs/test.log

      - name: Android SDK licenses
        # ubuntu-latest ya trae ANDROID_HOME (SDK moderno): la acción
        # android-actions/setup-android@v3 intenta instalar el paquete
        # 'tools', deprecado y removido, y muere con exit 1. Basta
        # aceptar las licencias de forma no interactiva.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -1)
          # Best-effort: si sdkmanager falla no aborta el job; las licencias
          # preinstaladas del runner suelen bastar y flutter build apk será
          # el juez real.
          yes 2>/dev/null | "$SDKM" --licenses > /tmp/ci-logs/licenses.log 2>&1 \
            || { echo "sdkmanager --licenses falló ($?): continuando"; tail -5 /tmp/ci-logs/licenses.log; }

      - name: Build debug APK
        working-directory: mobile
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/ci-logs/apkbuild.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goatvision-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Post failure logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### CI failure — Flutter (%s)\n' "${{ github.job }}" > /tmp/body.md
          for f in /tmp/ci-logs/*.log; do
            [ -s "$f" ] || continue
            printf '\n===== %s =====\n\n' "$(basename "$f")" >> /tmp/body.md
            tail -c 20000 "$f" >> /tmp/body.md
          done
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/body.md)" --silent || true
